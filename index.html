<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SLOW MOTION (CASTLE. Remix) — 逐日</title>
<style>
  :root {
    --bg: #04060c;
    --panel: rgba(8, 12, 22, 0.82);
    --line: rgba(120, 150, 200, 0.22);
    --text: #e8eefc;
    --dim: #7f95b8;
    --accent: #ffb547;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ---------- 舞台 ---------- */
  #stage-wrap { position: relative; flex: 1 1 auto; min-height: 0; background: #000; }
  #stage { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  #stage:focus { outline: none; }

  #status {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 15px; color: var(--dim); letter-spacing: .04em;
    pointer-events: none; text-align: center; text-shadow: 0 2px 10px #000;
  }
  #fatal {
    display: none; position: absolute; left: 20px; right: 20px; bottom: 20px;
    background: rgba(60, 12, 12, 0.92); border: 1px solid #a33;
    color: #ffd9d9; font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
    padding: 12px 14px; border-radius: 8px; white-space: pre-wrap; z-index: 30;
  }
  #debug {
    display: none; position: absolute; left: 12px; top: 12px;
    background: rgba(0,0,0,.66); border: 1px solid var(--line);
    color: #9fe8c0; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    padding: 8px 10px; border-radius: 6px; white-space: pre; pointer-events: none; z-index: 20;
  }

  /* ---------- 控制条 ---------- */
  #bar {
    flex: 0 0 auto; background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 10px 18px 12px;
    backdrop-filter: blur(8px);
  }
  .row { display: flex; align-items: center; gap: 14px; }
  .row + .row { margin-top: 9px; }

  button {
    background: rgba(255,255,255,.06); color: var(--text);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 14px; font-size: 13px; cursor: pointer;
    transition: background .15s, border-color .15s;
    font-family: inherit; white-space: nowrap;
  }
  button:hover { background: rgba(255,181,71,.16); border-color: rgba(255,181,71,.45); }
  button:active { transform: translateY(1px); }
  #btn-play { min-width: 92px; font-weight: 600; }

  .time { font: 13px/1 ui-monospace, Menlo, Consolas, monospace; color: var(--dim); white-space: nowrap; }
  #time-now { color: var(--accent); }

  /* 进度条 */
  .seek-wrap { position: relative; flex: 1 1 auto; height: 22px; display: flex; align-items: center; }
  .seek-track {
    position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,.10); overflow: hidden; pointer-events: none;
  }
  #seek-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: linear-gradient(90deg, #ffb547, #fff2d0);
  }
  #seek {
    position: relative; width: 100%; margin: 0; background: transparent;
    -webkit-appearance: none; appearance: none; height: 22px; cursor: pointer;
  }
  #seek::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: #fff2d0; border: 2px solid #ffb547; cursor: pointer;
    box-shadow: 0 0 8px rgba(255,181,71,.8);
  }
  #seek::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; background: #fff2d0;
    border: 2px solid #ffb547; cursor: pointer;
  }
  #seek::-webkit-slider-runnable-track { height: 22px; background: transparent; }

  .field { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); white-space: nowrap; }
  input[type=range].mini { width: 96px; accent-color: var(--accent); cursor: pointer; }
  #offset-val {
    font: 12px/1 ui-monospace, Menlo, Consolas, monospace;
    color: var(--accent); min-width: 58px; text-align: right;
  }
  #scene-label {
    font-size: 12px; color: var(--dim); letter-spacing: .02em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hint { font-size: 11px; color: #55637d; }
  kbd {
    background: rgba(255,255,255,.07); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 5px; font: 11px ui-monospace, monospace; color: var(--dim);
  }
  #selftest-out { display: none; }
  @media (max-width: 820px) {
    .hint { display: none; }
    #scene-label { font-size: 11px; }
  }
</style>
</head>
<body>
<div id="app">

  <div id="stage-wrap">
    <canvas id="stage" tabindex="0" aria-label="SLOW MOTION 动画舞台"></canvas>
    <div id="status">按空格或点击「播放」开始</div>
    <pre id="debug"></pre>
    <div id="fatal"></div>
  </div>

  <div id="bar">
    <div class="row">
      <button id="btn-play" aria-label="播放">▶ 播放</button>
      <button id="btn-replay" aria-label="重播">⟲ 重播</button>
      <span class="time" id="time-now">0:00.000</span>
      <div class="seek-wrap">
        <div class="seek-track"><div id="seek-fill"></div></div>
        <input id="seek" type="range" min="0" max="193977" step="1" value="0" aria-label="进度">
      </div>
      <span class="time" id="time-total">3:13.977</span>
    </div>
    <div class="row">
      <button id="btn-fs" aria-label="全屏">⛶ 全屏</button>
      <span class="field">音量
        <input id="vol" class="mini" type="range" min="0" max="100" step="1" value="90" aria-label="音量">
      </span>
      <span class="field">同步偏移
        <input id="offset" class="mini" type="range" min="-500" max="500" step="1" value="0" aria-label="同步偏移毫秒">
        <span id="offset-val">0 ms</span>
        <button id="offset-reset" style="padding:4px 9px;font-size:12px">归零</button>
      </span>
      <span id="scene-label"></span>
      <span class="hint" style="margin-left:auto">
        <kbd>空格</kbd>播放 <kbd>←</kbd><kbd>→</kbd>跳转 <kbd>Shift</kbd>+方向 1s <kbd>R</kbd>重播 <kbd>F</kbd>全屏 <kbd>[</kbd><kbd>]</kbd>偏移 10ms
      </span>
    </div>
  </div>

  <pre id="selftest-out"></pre>
</div>

<!-- 音频：绝不添加 crossorigin（注意事项.md ①，
     file:// 下加它必然导致 MEDIA_ERR_SRC_NOT_SUPPORTED，片子完全没声音） -->
<audio id="audio" src="audio/slow_motion.mp3" preload="auto"></audio>

<!-- 歌词时间轴与重音数据全部内嵌于本地 JS，运行时不访问网络（PROMPT.md 第 7、8 条）。
     使用经典 script 标签而非 ES module —— file:// 下 type="module" 会被 CORS 拦死。 -->
<script src="js/00_lyrics.js"></script>
<script src="js/01_score.js"></script>
<script src="js/02_stage.js"></script>
<script src="js/03_palette.js"></script>
<script src="js/04_scenes.js"></script>
<script src="js/05_draw.js"></script>
<script src="js/06_ui.js"></script>
<script>
(function () {
  'use strict';
  try {
    window.SM.App.boot();
    /* 点击舞台也可播放/暂停 */
    var cv = document.getElementById('stage');
    if (cv) cv.addEventListener('click', function () { window.SM.App.toggle(); });
    /* 出错时提示面板（错误绝不静默 —— 注意事项.md ②） */
    window.SM_onError = function (where, msg) {
      var f = document.getElementById('fatal');
      if (!f) return;
      f.style.display = 'block';
      f.textContent = '[' + where + ']\n' + msg;
    };
  } catch (e) {
    var f = document.getElementById('fatal');
    if (f) {
      f.style.display = 'block';
      f.textContent = '启动失败\n' + (e && e.stack ? e.stack : String(e)) +
        '\n页面地址: ' + location.href;
    }
  }

  /* ---------- 浏览器内自检：?selftest=1 ----------
     在【真实浏览器】里把全程扫一遍，检查异常、画板、音频与控制台错误。
     与 tools/verify.js 的 Node 几何校验互补：
       Node 端量绘图坐标（精确、不依赖浏览器）；
       这里跑真实 Canvas API（能抓到真实运行期错误）。 */
  if (/[?&]selftest=1/.test(location.search)) {
    setTimeout(function () {
      var SM = window.SM, out = [], i;
      try {
        var ctx = document.getElementById('stage').getContext('2d');
        var errs0 = SM.ErrorLog.items.length;
        var thrown = 0;
        var probe = [0, 55388, 73600, 92081, 112878, 129000, 131481, 150039, 168424, 182201, 186900];
        for (var ms = 0; ms <= SM.TOTAL_MS; ms += 500) {
          try { SM.renderFrame(ctx, ms, { quiet: true }); } catch (e) { thrown++; }
        }
        for (i = 0; i < probe.length; i++) {
          try { SM.renderFrame(ctx, probe[i], {}); } catch (e) { thrown++; }
        }
        out.push('RENDER_SWEEP  frames=' + (Math.ceil(SM.TOTAL_MS / 500) + probe.length) +
                 '  thrown=' + thrown +
                 '  logged=' + (SM.ErrorLog.items.length - errs0));
        out.push('CUES          count=' + SM.CUES.length +
                 '  scenes_missing=' + SM.sceneIds.filter(function (id) {
                   return typeof SM.Scenes[id] !== 'function';
                 }).join(',') || 'none');
        var a = document.getElementById('audio');
        out.push('AUDIO         readyState=' + a.readyState +
                 '  duration=' + (isFinite(a.duration) ? a.duration.toFixed(3) : 'n/a') +
                 '  error=' + (a.error ? a.error.code + '/' + a.error.message : 'none') +
                 '  src=' + a.getAttribute('src'));
        out.push('TIMEBASE      TOTAL_MS=' + SM.TOTAL_MS +
                 '  lastCueEnd=' + SM.Timeline.cueEndMs(SM.CUES.length - 1));
        out.push('RAF           frames=' + SM.App.frames + '  lastMs=' + SM.App.lastMs.toFixed(0));
        out.push('ERRORLOG      total=' + SM.ErrorLog.items.length);
        for (i = 0; i < Math.min(6, SM.ErrorLog.items.length); i++) {
          out.push('   ERR[' + i + '] ' + SM.ErrorLog.items[i].where + ' :: ' +
                   String(SM.ErrorLog.items[i].msg).split('\n')[0]);
        }
        var fatal = document.getElementById('fatal');
        out.push('FATAL_PANEL   display=' + fatal.style.display + '  text=' +
                 (fatal.textContent ? fatal.textContent.split('\n')[0] : '(empty)'));
      } catch (e) {
        out.push('SELFTEST_CRASH ' + (e && e.stack ? e.stack : e));
      }
      var el = document.getElementById('selftest-out');
      el.style.display = 'block';
      el.textContent = out.join('\n');
    }, 2200);
  }
})();
</script>
</body>
</html>
